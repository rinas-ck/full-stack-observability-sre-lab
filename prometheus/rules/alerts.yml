groups:
  - name: sre-alerts
    rules:
      - alert: ObservabilityAPIUnavailable
        expr: up{job="observability-api"} == 0
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "Observability API is unavailable"
          description: "Prometheus has been unable to scrape the API for 15 seconds."

      - alert: ObservabilityAPIHighErrorRate
        expr: |
          (
            sum(rate(http_requests_total{service="observability-api",status=~"5.."}[2m]))
            /
            clamp_min(sum(rate(http_requests_total{service="observability-api"}[2m])), 0.001)
          ) > 0.05
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Observability API has an elevated 5xx error rate"
          description: "More than 5% of API requests are returning 5xx responses."
